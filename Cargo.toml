[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rebro-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
ureq = { version = "2", features = ["json"] }

# Dependencies optimized and without debug info even in dev builds: the dev-built GUI (used when
# fxc.exe is missing) is fast and small instead of ~680 MB. Debug assertions stay on, which is what
# makes GPUI compile its shaders at runtime.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
strip = true
